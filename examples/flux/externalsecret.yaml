# The credential Secret the HelmRelease consumes, created by the External
# Secrets Operator (external-secrets.io/v1). The HelmRelease names this Secret
# twice — `spec.values.secretMounts` mounts it at /run/secrets/s3 for the
# configuration's file references, and `spec.values.rbac.secretNames` lets the
# tool read the same Secret through the API — so its target name must match
# both. A test in test/chart asserts that equality.
#
# Placeholders only: the store, the remote key and the credentials are the
# deployment's, and the key names are the files examples/config/minimal.yaml
# resolves under the mount path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-backup-s3
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: example-secret-store
  target:
    # Exactly secretMounts[].secretName and rbac.secretNames in
    # examples/flux/helmrelease.yaml.
    name: cluster-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: backup.example/s3-credentials
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: backup.example/s3-credentials
        property: secret-access-key
