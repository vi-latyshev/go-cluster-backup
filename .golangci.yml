version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    # The repository bans //nolint outright, and `make lint` enforces the ban
    # with a grep: golangci-lint v2.15.0's nolintlint has no option to forbid a
    # directive, only to constrain one. These are its strictest settings, so a
    # directive that ever slipped past the grep would still have to be specific
    # and carry an explanation.
    - nolintlint
    # The loader is the empty container: registration, kinds, services, roles,
    # selection and lifecycle over the standard library only. It must not reach
    # into a plugin, which would make the kernel know a feature.
    - depguard
  settings:
    depguard:
      rules:
        loader-stdlib-only:
          files:
            - "**/internal/loader/**"
            - "!$test"
          allow:
            - $gostd
    nolintlint:
      allow-unused: false
      require-specific: true
      require-explanation: true

formatters:
  enable:
    - gofmt
