# What decides a release, and where it is called: CI's publish job runs
# `git-cliff --bumped-version` for the tag and `git-cliff --tag` for the notes.
# A commit type maps to a version bump and a changelog group; anything else
# releases nothing. Never bump Chart.yaml by hand — the tag is the version.

[remote]
offline = true

[remote.github]
owner = "vi-latyshev"
repo = "go-cluster-backup"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v1.0.0"

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverts" },
  { message = "^.*", skip = true },
]

[changelog]
body = """
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% set ordinary = commits | filter(attribute="breaking", value=false) %}\
{% if breaking | length > 0 %}### Breaking changes
{% for commit in breaking %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking_description and commit.breaking_description != commit.message %} — {{ commit.breaking_description }}{% endif %} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/vi-latyshev/go-cluster-backup/commit/{{ commit.id }}))
{% endfor %}
{% endif %}\
{% for group, group_commits in ordinary | group_by(attribute="group") %}### {{ group }}
{% for commit in group_commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/vi-latyshev/go-cluster-backup/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
{% if previous.version and version %}**Full changelog**: https://github.com/vi-latyshev/go-cluster-backup/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
