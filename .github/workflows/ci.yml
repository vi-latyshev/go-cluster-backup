# Every action is pinned by commit SHA: this workflow holds packages:write and
# id-token:write. Pull requests run the checks; a push to master also builds the
# image and publishes it.
#
# A docs-only push does not run the workflow (paths-ignore). A pull request
# always does: a skipped workflow creates no check runs, and a required check
# that never appears cannot be satisfied.
name: ci

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "docs/**"]
  # Never pull_request_target: a fork's pull request must run with its own
  # read-only token, not the base repository's. A pull request keeps running on
  # a docs-only change, because a workflow skipped by paths-ignore creates no
  # check runs at all and a required check would never be satisfied.
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/vi-latyshev/go-cluster-backup
  CHART: ghcr.io/vi-latyshev/charts/go-cluster-backup

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # setup-go's shared key would race; the cache below is per job.
          cache: false
      # The cache is restored only: a save at the end of the job writes one entry
      # per commit on a push, so concurrent PRs never race on the same key and a
      # fork's read-only token can still restore. A prefix match from an earlier
      # commit serves as the starting point; the save at the end of the job
      # extends it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-cache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/.cache/kubeconform
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum', '.golangci.yml') }}-
            go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - name: commit messages
        run: |
          range="${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"
          commits="$(git rev-list --no-merges "$range" 2>/dev/null)" || commits="${{ github.sha }}"
          for sha in $commits; do
            git cat-file commit "$sha" | sed '1,/^$/d' | go tool -modfile=tools/go.mod commitlint lint || exit 1
          done
      # No separate `go vet`: golangci-lint's govet runs the same analysers as
      # part of `make lint` (the `standard` linter set).
      - run: make lint
      - run: make vuln
      - run: make chart
      # The pinned helm the chart gate built: publish pushes the chart with this
      # exact binary instead of resolving the tool again. Uploaded on a push
      # only — a pull request has no publish job to feed.
      - name: pin the helm binary
        if: github.event_name == 'push'
        run: |
          cp "$(go tool -modfile=tools/go.mod -n helm)" "$RUNNER_TEMP/helm"
          chmod +x "$RUNNER_TEMP/helm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: helm
          path: ${{ runner.temp }}/helm
          retention-days: 1
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push' && steps.go-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/.cache/kubeconform
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # setup-go's shared key would race; the cache below is per job.
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-cache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum') }}-
            go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      # BuildKit cannot export cache mounts; move them across runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: buildkit-mounts
        with:
          path: ${{ runner.temp }}/buildkit-cache-mounts
          key: buildkit-mounts-e2e-${{ runner.arch }}-${{ hashFiles('go.sum', 'Dockerfile') }}
          restore-keys: |
            buildkit-mounts-e2e-${{ runner.arch }}-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {"${{ runner.temp }}/buildkit-cache-mounts/go-build": {"target": "/root/.cache/go-build", "id": "go-build"},
             "${{ runner.temp }}/buildkit-cache-mounts/go-mod": {"target": "/go/pkg/mod", "id": "go-mod"}}
          skip-extraction: ${{ steps.buildkit-mounts.outputs.cache-hit }}
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance
          utility-image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      - name: install k3d
        env:
          K3D_VERSION: v5.9.0
          K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/k3d" \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  $RUNNER_TEMP/bin/k3d" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/k3d"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The unit suite runs once, here: `make test` gates it, `make e2e` adds the
      # suite that owns the cluster, `make cover` gates the union.
      - run: make test
      - run: |
          make e2e E2E_CLUSTER=gcb-e2e E2E_DOCKER="docker buildx build --load"
      - run: make cover
      - name: cluster diagnostics
        if: failure()
        run: |
          k3d cluster list || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.event_name == 'push' && steps.go-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  image:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A gha cache scope accumulates for the life of the repository; the ISO
      # week in the key bounds it to one week, so a poisoned or oversized entry
      # cannot outlive the week it was written in.
      - name: cache scope
        id: scope
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
      # By digest only: no human-facing tag exists before `publish` runs.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}-${{ steps.scope.outputs.week }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}-${{ steps.scope.outputs.week }}
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "${{ steps.build.outputs.digest }}" > "$RUNNER_TEMP/digests/image-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/image-${{ matrix.arch }}
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: [check, e2e, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The binary `check` built; no Go toolchain is needed here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm
          path: ${{ runner.temp }}/bin
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: merge the digests
        id: merge
        run: |
          set -eu
          refs=()
          for file in "$RUNNER_TEMP"/digests/*; do
            refs+=("${{ env.IMAGE }}@$(cat "$file")")
          done
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:sha-${GITHUB_SHA::7}" \
            -t "${{ env.IMAGE }}:master" \
            "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${{ env.IMAGE }}:master" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: sign the image
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        # Legacy bundle layout: Flux's cosign verifier cannot read the new one.
        run: |
          cosign sign --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            "${{ env.IMAGE }}@${DIGEST}"
      - name: install git-cliff
        env:
          GIT_CLIFF_VERSION: 2.14.2
          GIT_CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/git-cliff.tar.gz" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${GIT_CLIFF_SHA256}  $RUNNER_TEMP/git-cliff.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/git-cliff.tar.gz" \
            -C "$RUNNER_TEMP" "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          mv "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The version is a tag computed from the commits since the last release,
      # never a bump commit: a `Release-As:` trailer in the range wins, otherwise
      # git-cliff's bump rules decide. The tag is claimed before any versioned
      # write — a concurrent claim loses the push, and a version owned by another
      # commit skips the versioned steps instead of overwriting it.
      - name: claim the version
        id: version
        run: |
          set -euo pipefail
          if last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null)"; then
            range="${last}..HEAD"
          else
            range="HEAD"
          fi
          version="$(git log --format='%(trailers:key=Release-As,valueonly,unfold)' "$range" \
            | awk 'NF && !v {sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, ""); v = $0} END {print v}')"
          if [ -z "$version" ]; then
            version="$(git-cliff --bumped-version)"
          fi
          version="${version#v}"
          # Canonical SemVer 2.0.0, build metadata rejected: `+` is not valid in a
          # Docker tag, and the chart and image tag are built from this string.
          if ! printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'; then
            echo "::error::version '$version' is not SemVer 2.0.0 without build metadata"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
          case "$status" in
            2)
              git tag "v$version" "$GITHUB_SHA"
              git push origin "v$version"
              echo "claimed=true" >> "$GITHUB_OUTPUT"
              ;;
            0)
              tag_commit="$(git rev-parse --verify "v$version^{commit}")"
              if [ "$tag_commit" = "$GITHUB_SHA" ]; then
                echo "v$version is already claimed by this commit; resuming"
                echo "claimed=true" >> "$GITHUB_OUTPUT"
              else
                echo "v$version is tagged on $tag_commit, not $GITHUB_SHA: nothing new to release; versioned steps skipped"
                echo "claimed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error::cannot read refs/tags/v$version from origin (git ls-remote exit $status)"
              exit 1
              ;;
          esac
      - name: tag the image
        if: steps.version.outputs.claimed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${VERSION}" \
            "${{ env.IMAGE }}@${DIGEST}"
      - name: push the chart
        if: steps.version.outputs.claimed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm="$RUNNER_TEMP/bin/helm"
          chmod +x "$helm"
          "$helm" package charts/go-cluster-backup \
            --version "${VERSION}" --app-version "${VERSION}" --destination dist
          # GHCR can 404 a manifest it has just accepted ("Tag ... not found"). The
          # archive is not repackaged, so every attempt pushes the same digest.
          for attempt in 1 2 3; do
            status=0
            "$helm" push "dist/go-cluster-backup-${VERSION}.tgz" "oci://${CHART%/*}" | tee push.txt || status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::helm push failed $attempt times (exit $status)"
              exit "$status"
            fi
            echo "::warning::helm push attempt $attempt failed (exit $status); retrying"
            sleep $((attempt * 10))
          done
          digest="$(awk '$1 == "Digest:" { print $2 }' push.txt)"
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_ENV"
      - name: sign the chart
        if: steps.version.outputs.claimed == 'true'
        run: |
          cosign sign --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            "${{ env.CHART }}@${digest}"
      # The tag is the claim; a rerun re-uploads over the release it already
      # made, and the final edit publishes whatever state got here.
      - name: release
        if: steps.version.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git-cliff --current --strip all > RELEASE_NOTES.md
          flags=(--verify-tag --notes-file RELEASE_NOTES.md)
          if [ "${VERSION%%-*}" != "$VERSION" ]; then
            flags+=(--prerelease)
          fi
          tgz="dist/go-cluster-backup-${VERSION}.tgz"
          gh release create "v${VERSION}" "${flags[@]}" "$tgz" \
            || gh release upload "v${VERSION}" "$tgz" --clobber
          gh release edit "v${VERSION}" --draft=false
