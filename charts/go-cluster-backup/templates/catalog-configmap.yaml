{{- if .Values.catalog.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-cluster-backup.catalogName" . }}
  labels:
    {{- include "go-cluster-backup.labels" . | nindent 4 }}
  annotations:
    # The tool owns everything under `data` — the writer-lease record alone;
    # the chart never writes it, and helm must never prune the object away with
    # the release, or an uninstall would drop a live claim.
    helm.sh/resource-policy: keep
{{- end }}
